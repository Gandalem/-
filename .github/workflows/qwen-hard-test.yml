name: Qwen Hard Prompt Injection Evaluation

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of advanced cases (1-40)"
        required: false
        default: "40"
  push:
    paths:
      - "tests/hard_cases.json"
      - "tests/evaluate_hard.py"
      - ".github/workflows/qwen-hard-test.yml"

permissions:
  contents: read

jobs:
  classify-hard-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NCP_API_KEY: ${{ secrets.NCP_API }}
      CLAUDE_ENABLED: "0"
      NCP_BASE_URL: "https://223.130.136.240/v1"
      NCP_MODEL: "Qwen/Qwen3.8-27B-FP8"
      NCP_TIMEOUT: "30"
      NCP_REQUEST_SPACING_SECONDS: "5"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check unit tests
        run: python -m unittest -v test_guard.py

      - name: Run 40 challenging Qwen-only classification cases
        env:
          CASE_LIMIT: ${{ github.event.inputs.case_limit || '40' }}
        run: |
          set -euo pipefail
          python tests/evaluate_hard.py --limit "$CASE_LIMIT" --output results/hard_qwen_report.json

      - name: Upload labeled prediction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-qwen-results
          path: results/hard_qwen_report.json
          if-no-files-found: warn
