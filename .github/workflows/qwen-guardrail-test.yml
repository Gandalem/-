name: Qwen Guardrail Classification Test

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of cases (1-48, balanced by category)"
        required: false
        default: "48"

permissions:
  contents: read

jobs:
  qwen-only-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NCP_API_KEY: ${{ secrets.NCP_API }}
      CLAUDE_ENABLED: "0"
      NCP_BASE_URL: "https://223.130.136.240/v1"
      NCP_MODEL: "Qwen/Qwen3.8-27B-FP8"
      NCP_TIMEOUT: "30"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify stdlib unit tests
        run: python -m unittest -v test_guard.py

      - name: Qwen-only prompt injection classification test
        shell: bash
        env:
          CASE_LIMIT: ${{ github.event.inputs.case_limit || '48' }}
        run: |
          set -euo pipefail
          python tests/evaluate_guard.py --require-live --limit "$CASE_LIMIT" --output results/guardrail_qwen_report.json

      - name: Upload JSON test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-guardrail-report
          path: results/guardrail_qwen_report.json
          if-no-files-found: warn
