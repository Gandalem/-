name: Qwen Multilingual Guard Test

on:
  workflow_dispatch:
    inputs:
      case_limit:
        description: "Number of mixed Chinese/Korean/English test cases (1-40)"
        required: false
        default: "40"
  push:
    paths:
      - "guard.py"
      - "tests/multilingual_cases.json"
      - "tests/evaluate_multilingual.py"
      - ".github/workflows/qwen-multilingual-test.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NCP_API_KEY: ${{ secrets.NCP_API }}
      CLAUDE_ENABLED: "0"
      NCP_BASE_URL: "https://223.130.136.240/v1"
      NCP_MODEL: "Qwen/Qwen3.8-27B-FP8"
      NCP_TIMEOUT: "30"
      NCP_REQUEST_SPACING_SECONDS: "5"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate unit tests
        run: python -m unittest -v test_guard.py
      - name: Evaluate current guard.py on 40 multilingual prompts
        env:
          CASE_LIMIT: ${{ github.event.inputs.case_limit || '40' }}
        run: |
          set -euo pipefail
          python tests/evaluate_multilingual.py --limit "$CASE_LIMIT"
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-guard-results
          path: |
            results/multilingual_guard.json
            results/multilingual_summary.json
          if-no-files-found: warn
